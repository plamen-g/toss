# Push a tag like v0.1.0 and this builds toss for every platform, attaches the files to a GitHub release,
# and publishes the MCP bundle to the MCP Registry.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, file: toss-windows-x86_64.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, file: toss-macos-arm64.tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, file: toss-macos-x86_64.tar.gz }
          # 22.04 so the binary also runs on older glibc (Ubuntu 22.04, Debian 12)
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, file: toss-linux-x86_64.tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, file: toss-linux-arm64.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to commits, so a moved or hijacked tag can't slip code into the release builds.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo test --locked
        if: matrix.target != 'x86_64-apple-darwin' # cross-built on an ARM Mac, can't run its tests
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          dir=target/${{ matrix.target }}/release
          if [[ "${{ matrix.file }}" == *.exe ]]; then cp "$dir/toss.exe" "${{ matrix.file }}"; else tar czf "${{ matrix.file }}" -C "$dir" toss; fi
      - name: upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true # whichever job is first creates it
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.file }}" assets/OFL-BricolageGrotesque.txt --clobber # the font's license travels with it

  # One Mac download for every Mac: both builds in one program, as toss.app in toss-macos.dmg. (The .tar.gz
  # files stay, for the terminal and the MCP bundle.)
  mac:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: disk image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern 'toss-macos-*.tar.gz' --dir dl
          for arch in arm64 x86_64; do
            mkdir -p "dl/$arch"
            tar xzf "dl/toss-macos-$arch.tar.gz" -C "dl/$arch"
          done
          lipo -create -output dl/toss dl/arm64/toss dl/x86_64/toss
          sh macos/bundle.sh dl/toss dist
          ditto -c -k --keepParent dist/toss.app dist/toss-macos.zip # what toss's own updates download
          gh release upload "$GITHUB_REF_NAME" dist/toss-macos.dmg dist/toss-macos.zip --clobber

  # The checksums of every download, signed, so toss's updates can check what they install. The key is the
  # TOSS_RELEASE_KEY secret (a PEM file); its public half is in src/update.rs.
  sign:
    needs: [build, mac]
    runs-on: ubuntu-latest
    steps:
      - name: sign
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KEY: ${{ secrets.TOSS_RELEASE_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEY" || { echo "the TOSS_RELEASE_KEY secret isn't set, and toss won't install unsigned updates"; exit 1; }
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'toss-*' --dir dl
          cd dl
          sha256sum toss-* > SHA256SUMS
          umask 077 # the key file: readable by this job only, and gone with the runner
          printf '%s\n' "$RELEASE_KEY" > "$RUNNER_TEMP/release-key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release-key.pem" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm "$RUNNER_TEMP/release-key.pem"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" SHA256SUMS SHA256SUMS.sig --clobber

  # mcpb's check of the bundle's manifest. Its npm dependencies aren't pinned, so it runs here, where it
  # can't touch the release or publish, and never where the bundle is made.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: cp assets/icon.png mcpb/ && npx --yes @anthropic-ai/mcpb@2.1.2 validate mcpb/manifest.json # it wants the icon beside the manifest

  # One MCP bundle for every platform, for Claude Desktop and the MCP Registry: the Windows build, and
  # the macOS and Linux ones behind a launcher that picks this machine's (the bundle format can only
  # pick by OS, not by CPU). Runs once every build is attached, so it never publishes a partial bundle.
  mcp:
    needs: [build, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the bundle to the release
      id-token: write # the registry trusts this repository's GitHub identity: no token to keep or leak
    env:
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          # The registry keeps every version for good, so a tag that disagrees with the code stops here.
          grep -q "^version = \"$version\"" Cargo.toml || { echo "tag $GITHUB_REF_NAME doesn't match Cargo.toml"; exit 1; }
          gh release download "$GITHUB_REF_NAME" --pattern 'toss-*' --dir dl
          mkdir -p bundle/server
          cp dl/toss-windows-x86_64.exe bundle/server/toss.exe
          for build in macos-arm64:Darwin-arm64 macos-x86_64:Darwin-x86_64 linux-x86_64:Linux-x86_64 linux-arm64:Linux-aarch64; do
            tar xzf "dl/toss-${build%%:*}.tar.gz" -C dl
            mv dl/toss "bundle/server/toss-${build##*:}" # named as `uname -s`-`uname -m` print, for the launcher
          done
          cp mcpb/toss bundle/server/toss
          cp assets/icon.png LICENSE assets/OFL-BricolageGrotesque.txt bundle/ # the licenses travel with the binaries
          jq --arg v "$version" '.version = $v' mcpb/manifest.json > bundle/manifest.json
          chmod +x bundle/server/*
          # A bundle is a zip with manifest.json on top. Zipped on Linux, so the files stay executable.
          (cd bundle && zip -qr ../toss.mcpb .)
          gh release upload "$GITHUB_REF_NAME" toss.mcpb --clobber
          jq --arg v "$version" --arg sha "$(sha256sum toss.mcpb | cut -d' ' -f1)" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/toss.mcpb" \
            '.version = $v | .packages[0].identifier = $url | .packages[0].fileSha256 = $sha' server.json > server.tmp
          mv server.tmp server.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: publish to the MCP Registry
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base=https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          # Only run a publisher that the registry's own release workflow signed.
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
