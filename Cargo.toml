[package]
name = "toss"
version = "0.1.0"
edition = "2024"
description = "Send files to your own devices and friends, peer to peer. No IP addresses, no accounts."
license = "MIT"

[dependencies]
anyhow = "1"
dirs = "6"
iroh = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "time"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
