[package]
name = "toss"
version = "0.3.1"
edition = "2024"
description = "Send files to your own devices and friends, peer to peer. No IP addresses, no accounts."
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
dirs = "6"
icu_normalizer = "2" # already in the build through iroh; compares file names like a Mac does
# On aws-lc-rs instead of ring, so every connection can use the hybrid post-quantum key exchange
# (X25519 + ML-KEM-768) that rustls prefers below. Port mapping stays out: toss never used it.
iroh = { version = "1.4.1", default-features = false, features = ["tls-aws-lc-rs", "fast-apple-datapath"] }
qrcodegen = "1.8"
# Updates from GitHub releases. Both already come with iroh, built the same way.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
sha2 = "0.11"
rfd = "0.17.2"
rmcp = { version = "3.8", features = ["transport-io", "schemars", "elicitation"] } # the official MCP SDK, for `toss mcp`
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Software renderer only: the GPU renderers cost 50-150 MB of RAM for a window this simple.
# Pairing codes. The pre-release, as it's built on the RustCrypto versions iroh already brings; 0.4 would add a second copy.
spake2 = { version = "=0.5.0-pre.0", features = ["getrandom"] }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "software-renderer-systemfonts", "accessibility", "system-tray", "software-renderer-path", "unstable-winit-030"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "net", "process", "time", "sync"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2"

# Shortcuts for starting at login and Explorer's "Send to" menu; already in the build through Slint.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }

# Load fontconfig when the window needs it instead of linking it: a hard link stops toss from even
# starting on servers without it, and needs its development files to build.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }

[dev-dependencies]
noq = { version = "1.4", default-features = false } # only to read which key exchange a test connection negotiated
rmcp = { version = "3.8", features = ["client", "transport-child-process"] } # drives `toss mcp` in tests like a real client
